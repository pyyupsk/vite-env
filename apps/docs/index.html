<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141618" media="(prefers-color-scheme: dark)" />
    <script>
      (() => {
        const media = matchMedia("(prefers-color-scheme: dark)");
        const apply = () => {
          let theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") theme = media.matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        };
        apply();
        media.addEventListener("change", apply);
        addEventListener("themechange", apply);
      })();
    </script>
    <title>vite-env: typed, validated environment variables for Vite</title>
    <meta
      name="description"
      content="vite-env validates your environment variables with Zod or Standard Schema when Vite starts or builds. Your code imports typed values from the client and server virtual modules."
